<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>대학원 수료 및 졸업</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style id="css">
:root{
  color-scheme:light;
  --ground:#EEF2F9;--surface:#FFFFFF;--surface-2:#F5F7FC;--line:#DCE3EF;--line-2:#C7D2E4;
  --ink:#0C1830;--ink-2:#3E4C68;--ink-3:#6C7A97;
  --accent:#1F5AE0;--accent-ink:#1646B3;--accent-soft:#E4ECFF;--cyan:#2FB8EE;--primary:#1F5AE0;
  --note-bg:#FFF6E2;--note-line:#EDC56C;--note-ink:#664709;--danger:#BF3434;--detour:#6A7DAE;--tip-bg:#0C1830;--tip-ink:#FFFFFF;
  --hero-1:#07122C;--hero-2:#0D2660;--hero-3:#1B53D0;
  --medal-1:#FFFFFF;--medal-2:#E3ECFF;
  --shadow-lg:0 1px 2px rgba(9,22,54,.05),0 28px 56px -28px rgba(9,22,54,.32);
  --shadow-sm:0 1px 2px rgba(9,22,54,.05),0 10px 24px -16px rgba(9,22,54,.28);
  --sans:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --ground:#060C1A;--surface:#0D172D;--surface-2:#111D38;--line:#1F2C4A;--line-2:#2B3B60;
  --ink:#E7EDF8;--ink-2:#AEBBD4;--ink-3:#7F8DAA;
  --accent:#6E9EFF;--accent-ink:#A8C3FF;--accent-soft:#15254A;--cyan:#4FCDF8;--primary:#2F6BF0;
  --note-bg:#231B0A;--note-line:#6A5120;--note-ink:#F0D69C;--danger:#FF8B8B;--detour:#8FA0CC;--tip-bg:#E7EDF8;--tip-ink:#0C1830;
  --hero-1:#040A1A;--hero-2:#0A1E4D;--hero-3:#1847B8;
  --medal-1:#1B2B52;--medal-2:#0E1A35;
  --shadow-lg:0 1px 2px rgba(0,0,0,.4),0 28px 56px -28px rgba(0,0,0,.7);
  --shadow-sm:0 1px 2px rgba(0,0,0,.4),0 10px 24px -16px rgba(0,0,0,.6);
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --ground:#060C1A;--surface:#0D172D;--surface-2:#111D38;--line:#1F2C4A;--line-2:#2B3B60;
  --ink:#E7EDF8;--ink-2:#AEBBD4;--ink-3:#7F8DAA;
  --accent:#6E9EFF;--accent-ink:#A8C3FF;--accent-soft:#15254A;--cyan:#4FCDF8;--primary:#2F6BF0;
  --note-bg:#231B0A;--note-line:#6A5120;--note-ink:#F0D69C;--danger:#FF8B8B;--detour:#8FA0CC;--tip-bg:#E7EDF8;--tip-ink:#0C1830;
  --hero-1:#040A1A;--hero-2:#0A1E4D;--hero-3:#1847B8;
  --medal-1:#1B2B52;--medal-2:#0E1A35;
  --shadow-lg:0 1px 2px rgba(0,0,0,.4),0 28px 56px -28px rgba(0,0,0,.7);
  --shadow-sm:0 1px 2px rgba(0,0,0,.4),0 10px 24px -16px rgba(0,0,0,.6);
}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
[hidden]{display:none!important}
img{max-width:100%}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.65;word-break:keep-all;overflow-wrap:anywhere;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* hero */
.hero{position:relative;overflow:hidden;color:#fff;padding-inline:16px;padding-block:14px clamp(92px,9vw,100px);
  background:radial-gradient(900px 420px at 88% -10%,rgba(47,184,238,.30),transparent 60%),linear-gradient(125deg,var(--hero-1) 0%,var(--hero-2) 55%,var(--hero-3) 100%)}
.hero-grid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px);background-size:48px 48px;
  -webkit-mask-image:linear-gradient(180deg,transparent,#000 35%,#000 60%,transparent);mask-image:linear-gradient(180deg,transparent,#000 35%,#000 60%,transparent)}
.skyline{position:absolute;left:0;right:0;bottom:0;height:150px}
.skyline svg{width:100%;height:100%;display:block}
.hero-in{position:relative;max-width:1160px;margin:0 auto;display:flex;align-items:flex-end;justify-content:space-between;gap:24px}
.eyebrow{font-family:var(--mono);font-size:12px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:#9CC3FF;margin:0 0 14px}
.hero h1{font-size:clamp(30px,4.8vw,48px);line-height:1.12;letter-spacing:-.025em;font-weight:700;margin:0;text-wrap:balance}
.hl{background:linear-gradient(90deg,#7ED3FF,#FFFFFF 80%);-webkit-background-clip:text;background-clip:text;color:transparent}
.lede{max-width:34em;color:#C8D6F2;font-size:16px;margin:16px 0 0}
.meta{display:flex;gap:8px;flex-wrap:wrap;margin:22px 0 0;padding:0;list-style:none}
.meta li{font-size:12.5px;padding:5px 12px;border-radius:999px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);color:#DDE8FB;font-variant-numeric:tabular-nums}
.hero-mascot{position:relative;flex:0 0 auto;width:clamp(120px,17vw,178px);margin-bottom:-8px}
.hero-mascot svg,.hero-mascot img{display:block;width:100%;height:auto;filter:drop-shadow(0 18px 24px rgba(0,0,0,.35))}
.bubble{position:absolute;right:86%;top:4%;white-space:normal;width:max-content;max-width:160px;line-height:1.4;background:#fff;color:#0C1830;font-size:13px;font-weight:600;padding:8px 13px;border-radius:14px 14px 4px 14px;box-shadow:0 10px 24px -10px rgba(0,0,0,.5)}
.admin-btn{position:absolute;top:16px;right:16px;z-index:2;display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;padding:7px 13px;border-radius:999px;cursor:pointer;color:#fff;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.25);backdrop-filter:blur(6px)}
.admin-btn:hover{background:rgba(255,255,255,.18)}
.hero-top{position:relative;z-index:2;max-width:1160px;margin:0 auto clamp(10px,2.4vw,22px);display:flex;justify-content:flex-end;align-items:center;gap:8px}
.hero-top .admin-btn{position:static}
.lang{display:inline-flex;padding:3px;border-radius:999px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.2);backdrop-filter:blur(6px)}
.lang button{appearance:none;background:none;border:0;cursor:pointer;padding:4px 12px;border-radius:999px;font-size:12.5px;font-weight:600;color:#C8D6F2;transition:background .2s,color .2s}
.lang button:hover{color:#fff}
.lang button[aria-pressed="true"]{background:#fff;color:#0B1D4A}
.admin-btn svg{width:15px;height:15px}
.admin-btn .dirty-dot{width:7px;height:7px;border-radius:50%;background:#FFC94D}

/* layout */
.wrap{position:relative;max-width:1160px;margin:-80px auto 0;padding-inline:16px;padding-bottom:40px;display:grid;gap:20px}

/* roadmap */
.road-card{background:var(--surface);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow-lg);padding:18px clamp(16px,3vw,28px) 14px}
.road-head{display:flex;justify-content:space-between;align-items:center;gap:8px 16px;flex-wrap:wrap}
.road-head h2{font-size:18px;margin:0;letter-spacing:-.01em}
.road-head p{margin:0;font-size:13.5px;color:var(--ink-3)}
.road{display:grid;grid-template-columns:repeat(var(--cols),minmax(0,1fr))}
.node{position:relative;appearance:none;background:none;border:0;padding:0 6px 10px;margin:0;cursor:pointer;display:flex;flex-direction:column;align-items:center;text-align:center;border-radius:14px}
.node.goal{cursor:default}
.dotrow{width:100%;height:116px;display:grid;place-items:center}
.dot{position:relative;z-index:1;width:64px;height:64px;border-radius:50%;display:grid;place-items:center;background:var(--surface);border:1.5px solid var(--line-2);color:var(--accent);transition:transform .25s,box-shadow .25s,border-color .25s}
.dot svg{width:26px;height:26px}
.node:not(.goal):hover .dot{transform:translateY(-3px);border-color:var(--accent)}
.node[aria-selected="true"] .dot{background:linear-gradient(140deg,#0D2660,#1F5AE0 60%,#2FB8EE);color:#fff;border-color:transparent;box-shadow:0 0 0 6px var(--accent-soft),0 14px 28px -10px rgba(31,90,224,.6)}
.txt{display:flex;flex-direction:column;align-items:center;gap:2px}
.step{font-family:var(--mono);font-size:11px;font-weight:500;letter-spacing:.12em;color:var(--ink-3)}
.node[aria-selected="true"] .step,.goal .step{color:var(--accent)}
.nm{font-weight:700;font-size:15.5px;line-height:1.35;color:var(--ink)}
.tg{font-size:12.5px;color:var(--ink-3);line-height:1.45;max-width:14em}
.arrow{position:absolute;top:58px;left:calc(50% + 42px);width:calc(100% - 84px);height:2px;background:linear-gradient(90deg,var(--accent),var(--cyan));pointer-events:none}
.arrow::after{content:"";position:absolute;right:0;top:50%;width:8px;height:8px;border-top:2px solid var(--cyan);border-right:2px solid var(--cyan);transform:translate(0,-50%) rotate(45deg)}
.node.last .arrow{width:calc(100% - 110px)}
.medal{position:relative;width:116px;height:116px;border-radius:50%;padding:4px;background:conic-gradient(from 200deg,#0D2660,#1F5AE0,#2FB8EE,#9ADCFF,#1F5AE0,#0D2660);box-shadow:0 18px 36px -16px rgba(31,90,224,.6)}
.medal-in{width:100%;height:100%;border-radius:50%;background:radial-gradient(circle at 50% 30%,var(--medal-1),var(--medal-2));display:grid;place-items:center;overflow:hidden}
.medal-in svg,.medal-in img{width:86%;height:auto;margin-top:8%}
.spark{position:absolute;width:16px;height:16px}
.spark.s1{top:2px;right:-6px;color:#F2B84B}
.spark.s2{bottom:14px;left:-10px;width:11px;height:11px;color:var(--cyan)}

/* branching flow */
.routes{display:flex;flex-wrap:wrap;gap:8px}
.route{appearance:none;display:inline-flex;align-items:center;gap:8px;cursor:pointer;padding:5px 12px 5px 6px;border-radius:999px;border:1px solid var(--line);background:var(--surface-2);transition:border-color .2s,box-shadow .2s}
.route:hover{border-color:var(--accent)}
.route[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);background:var(--surface)}
.route b{font-size:13.5px;font-weight:600;color:var(--ink)}
.route{position:relative}
.rtip{position:absolute;top:calc(100% + 10px);right:0;z-index:5;width:max-content;max-width:min(280px,80vw);white-space:normal;text-align:left;padding:9px 13px;border-radius:10px;background:var(--tip-bg);color:var(--tip-ink);font-size:12.5px;font-weight:500;line-height:1.5;box-shadow:0 14px 28px -12px rgba(0,0,0,.45);opacity:0;visibility:hidden;transform:translateY(-4px);transition:opacity .16s,transform .16s,visibility .16s;pointer-events:none}
.rtip::before{content:"";position:absolute;top:-5px;right:22px;width:10px;height:10px;background:var(--tip-bg);transform:rotate(45deg);border-radius:2px}
.route:hover .rtip,.route:focus .rtip{opacity:1;visibility:visible;transform:none}
.ntip{position:absolute;left:50%;bottom:calc(100% - 4px);z-index:6;width:max-content;max-width:min(240px,80vw);white-space:normal;text-align:center;padding:8px 12px;border-radius:10px;background:var(--tip-bg);color:var(--tip-ink);font-size:12.5px;font-weight:600;line-height:1.45;box-shadow:0 14px 28px -12px rgba(0,0,0,.45);opacity:0;visibility:hidden;transform:translate(-50%,4px);transition:opacity .16s,transform .16s,visibility .16s;pointer-events:none}
.ntip::after{content:"";position:absolute;left:50%;bottom:-5px;width:10px;height:10px;margin-left:-5px;background:var(--tip-bg);transform:rotate(45deg);border-radius:2px}
.node:hover .ntip,.node:focus-visible .ntip{opacity:1;visibility:visible;transform:translate(-50%,0)}
.rt{flex:0 0 auto;display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;font-family:var(--mono);font-size:11.5px;font-weight:600;color:#fff}
.rt.a{background:linear-gradient(140deg,#1F5AE0,#2FB8EE)}
.rt.b{background:var(--detour)}
.rline{flex:0 0 28px;width:28px;height:8px}
.rline path{fill:none;stroke:var(--accent);stroke-width:2.5;stroke-linecap:round}
.rline.dash path{stroke:var(--detour);stroke-dasharray:5 5}
.flow{position:relative;display:grid;grid-template-columns:repeat(var(--cols),minmax(0,1fr));row-gap:4px;margin-top:6px}
.flow>.fnode{grid-column:var(--c);grid-row:var(--r)}
.flow .dotrow{height:84px}
.flow .medal{width:84px;height:84px}
.flow>.fnode.lane-detour{padding-top:58px}
.flow .node{padding-bottom:4px}
.flow .tg{line-height:1.35}
.fnode{z-index:1}
.wires{position:absolute;left:0;top:0;z-index:0;pointer-events:none;overflow:visible}
.wires path{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:opacity .2s,stroke-width .2s}
.wires .e-direct,.wires .e-common{stroke:var(--accent)}
.wires .e-detour{stroke:var(--detour);stroke-dasharray:6 6}
.node.start{cursor:default}
.node.start .dot{background:#0D2660;border-color:#0D2660;color:#fff}
.lane-detour .dot{border-style:dashed;border-color:var(--detour);color:var(--detour)}
.lane-detour .step{color:var(--detour)}
.wlabel{position:absolute;z-index:1;transform:translate(-50%,-100%);white-space:nowrap;font-size:11.5px;font-weight:600;line-height:1.4;padding:2px 9px;border-radius:999px;background:var(--surface);border:1px solid var(--line);color:var(--accent-ink);transition:opacity .2s}
.wlabel.lbl-detour{transform:translate(0,-50%);color:var(--ink-2);border-style:dashed;border-color:var(--detour);opacity:0;visibility:hidden;transition:opacity .16s,visibility .16s}
.flow.tip-b .wlabel.lbl-detour{opacity:1;visibility:visible}
.road-card[data-route="direct"] .lane-detour{opacity:.3}
.road-card[data-route="direct"] .e-detour,.road-card[data-route="direct"] .lbl-detour{opacity:.12}
.road-card[data-route="detour"] .e-direct,.road-card[data-route="detour"] .lbl-direct{opacity:.12}
.road-card[data-route="direct"] .e-direct,.road-card[data-route="direct"] .e-common,.road-card[data-route="detour"] .e-detour,.road-card[data-route="detour"] .e-common{stroke-width:3}
.p-route{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin:8px 0 0;font-size:13px;color:var(--ink-2)}
.p-route .rt{width:20px;height:20px;font-size:11px;border-radius:6px}
@media (max-width:860px){
  .ntip{left:88px;bottom:auto;top:50%;transform:translate(4px,-50%);text-align:left}
  .ntip::after{left:-5px;bottom:auto;top:50%;margin:-5px 0 0}
  .node:hover .ntip,.node:focus-visible .ntip{transform:translate(0,-50%)}
  .rtip{right:auto;left:0}
  .rtip::before{right:auto;left:18px}
  .flow{grid-template-columns:minmax(0,1fr);row-gap:0;margin-top:8px}
  .flow>.fnode{grid-column:auto;grid-row:auto}
  .flow>.fnode.lane-detour{margin-left:48px;padding-top:10px}
  .flow .dotrow{height:auto}
  .flow .medal{width:72px;height:72px}
  .flow>.fnode.lane-common{margin-top:4px}
  .wlabel{display:none}
}

/* separate requirement band */
.rules{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:10px;margin-top:8px;padding-top:12px;border-top:1px solid var(--line)}
.rule{appearance:none;width:100%;display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:10px;text-align:left;cursor:pointer;padding:8px 12px 8px 8px;border-radius:12px;border:1.5px dashed var(--line-2);background:linear-gradient(90deg,var(--accent-soft),var(--surface) 70%);transition:border-color .2s,box-shadow .2s}
.rule:hover{border-color:var(--accent)}
.rule[aria-pressed="true"]{border-style:solid;border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.rule-ic{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:var(--surface);border:1.5px solid var(--line-2);color:var(--accent)}
.rule-ic svg{width:19px;height:19px}
.rule[aria-pressed="true"] .rule-ic{background:linear-gradient(140deg,#0D2660,#1F5AE0 60%,#2FB8EE);border-color:transparent;color:#fff}
.rule-txt{display:flex;flex-direction:column;gap:1px;min-width:0}
.rule-k{font-family:var(--mono);font-size:10.5px;font-weight:500;letter-spacing:.06em;color:var(--accent);line-height:1.4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rule-nm{font-weight:700;font-size:14px;color:var(--ink);line-height:1.35}
.rule-tg{display:none}
.rule-join{display:inline-flex;align-items:center;gap:4px;white-space:nowrap;font-size:11.5px;font-weight:600;color:var(--accent-ink);padding:3px 9px;border-radius:999px;background:var(--surface);border:1px solid var(--line)}
.rule-join svg{width:13px;height:13px}
@media (max-width:420px){.rule-join{display:none}.rule{grid-template-columns:auto minmax(0,1fr)}}

/* panel */
.panel{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:20px;align-items:start}
.panel.solo{grid-template-columns:minmax(0,1fr)}
.p-main{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:clamp(20px,3.2vw,36px);box-shadow:var(--shadow-sm);animation:rise .35s ease-out}
@keyframes rise{from{opacity:.35;transform:translateY(6px)}to{opacity:1;transform:none}}
.p-head{display:flex;gap:16px;align-items:center;padding-bottom:20px;border-bottom:1px solid var(--line);margin-bottom:22px}
.p-icon{flex:0 0 auto;width:56px;height:56px;border-radius:16px;display:grid;place-items:center;color:#fff;background:linear-gradient(140deg,#0D2660,#1F5AE0 60%,#2FB8EE)}
.p-icon svg{width:26px;height:26px}
.p-step{margin:0;font-family:var(--mono);font-size:12px;letter-spacing:.12em;color:var(--accent);font-weight:600}
.p-step span{color:var(--ink-3);font-weight:500}
.p-head h2{font-size:clamp(22px,2.6vw,28px);line-height:1.25;letter-spacing:-.015em;margin:2px 0 0;text-wrap:balance}
.p-tg{margin:4px 0 0;color:var(--ink-3);font-size:14px}
.kf{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-bottom:28px}
.kf div{background:var(--surface-2);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.kf b{display:block;font-size:20px;font-weight:700;letter-spacing:-.01em;line-height:1.3;color:var(--accent-ink);font-variant-numeric:tabular-nums}
.kf span{display:block;margin-top:2px;font-size:12.5px;line-height:1.45;color:var(--ink-3)}

.md{max-width:72ch}
.md h3{display:flex;align-items:center;gap:10px;font-size:16.5px;letter-spacing:-.01em;margin:30px 0 12px}
.md h3::before{content:"";flex:0 0 auto;width:8px;height:8px;border-radius:2px;transform:rotate(45deg);background:linear-gradient(135deg,var(--accent),var(--cyan))}
.md>:first-child{margin-top:0}
.md p{margin:0 0 12px;color:var(--ink-2)}
.md strong{color:var(--ink);font-weight:600}
.md ul.list{list-style:none;margin:0 0 14px;padding:0;display:grid;gap:8px}
.md ul.list>li{position:relative;padding-left:20px;color:var(--ink-2)}
.md ul.list>li::before{content:"";position:absolute;left:4px;top:.72em;width:6px;height:6px;border-radius:50%;background:var(--accent)}
.md ul.list>li.num{padding-left:26px}
.md ul.list>li.num::before,.md ul.list>li.plain::before{display:none}
.md ul.list>li.plain{padding-left:0}
.md .n{position:absolute;left:0;top:0;color:var(--accent);font-weight:700}
.md ul.sub-list{margin:6px 0 2px;gap:4px}
.md ul.sub-list>li{font-size:14px}
.md ul.sub-list>li::before{width:8px;height:1.5px;border-radius:0;background:var(--ink-3);top:.85em;left:2px}
.facts{margin:0 0 18px;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.facts div{display:grid;grid-template-columns:120px minmax(0,1fr);gap:14px;padding:12px 16px}
.facts div+div{border-top:1px solid var(--line)}
.facts dt{font-weight:600;font-size:14px;color:var(--ink)}
.facts dd{margin:0;color:var(--ink-2)}
.note{display:flex;gap:10px;align-items:flex-start;margin:18px 0 12px;padding:12px 14px;border-radius:12px;background:var(--note-bg);border:1px solid var(--note-line);color:var(--note-ink);font-size:14px}
.note svg{flex:0 0 auto;width:18px;height:18px;margin-top:2px}
.md p.foot{position:relative;padding-left:16px;font-size:13px;color:var(--ink-3);margin-top:-2px}
.md p.foot::before{content:"*";position:absolute;left:3px;top:0}
.sub{margin:0 0 10px;padding:14px 16px 6px;border:1px solid var(--line);border-radius:14px;background:var(--surface-2)}
.sub h4{display:flex;gap:8px;align-items:center;margin:0 0 10px;font-size:14.5px}
.sub h4 svg{flex:0 0 auto;width:17px;height:17px;color:var(--accent)}
.sub ul.list{margin-bottom:8px}
.sub ul.list>li{font-size:14px}
.pager{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-top:28px;padding-top:18px;border-top:1px solid var(--line)}
.done-note{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--ink-3)}
.done-note svg{width:16px;height:16px;color:var(--accent)}

.p-side{display:grid;gap:14px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 16px)}
.go{position:relative;overflow:hidden;border-radius:18px;padding:20px;color:#fff;background:linear-gradient(140deg,#0B1D4A,#1B4FC8 70%,#2F8CF0)}
.go::after{content:"";position:absolute;right:-50px;top:-50px;width:150px;height:150px;border-radius:50%;border:24px solid rgba(255,255,255,.07)}
.go-k{margin:0;font-family:var(--mono);font-size:11px;letter-spacing:.14em;color:#9CC3FF;text-transform:uppercase}
.go-t{margin:6px 0 2px;font-weight:600;font-size:15px;line-height:1.45}
.go-h{margin:0;font-family:var(--mono);font-size:11.5px;color:rgba(255,255,255,.62);word-break:break-all}
.btn-go{position:relative;z-index:1;display:flex;justify-content:space-between;align-items:center;margin-top:16px;padding:12px 16px;border-radius:12px;background:#fff;color:#0B1D4A;font-weight:700;text-decoration:none;transition:transform .2s}
.btn-go:hover{transform:translateX(3px)}
.btn-go svg{width:18px;height:18px}
.files{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px 16px 6px}
.side-k{margin:0 0 4px;font-family:var(--mono);font-size:11px;letter-spacing:.14em;color:var(--ink-3);text-transform:uppercase}
.file{display:flex;gap:12px;align-items:center;padding:10px 0}
.file+.file{border-top:1px solid var(--line)}
.ext{flex:0 0 auto;width:38px;height:44px;border-radius:6px 12px 6px 6px;display:grid;place-items:end center;padding-bottom:6px;background:var(--accent-soft);color:var(--accent-ink);font-family:var(--mono);font-size:10.5px;font-weight:600}
.fi{flex:1;min-width:0}
.fname{margin:0;font-size:13.5px;font-weight:600;line-height:1.4}
.fmeta{margin:2px 0 0;font-size:12px;color:var(--ink-3)}
.dl{flex:0 0 auto;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;cursor:pointer;border:1px solid var(--line-2);background:var(--surface);color:var(--accent)}
.dl:hover{background:var(--accent-soft)}
.dl svg{width:18px;height:18px}
.tip{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-radius:18px;border:1px dashed var(--line-2);background:var(--surface)}
.tip .mini{flex:0 0 52px;width:52px}
.tip .mini svg,.tip .mini img{display:block;width:100%;height:auto}
.tip b{font-family:var(--mono);font-size:11px;letter-spacing:.12em;color:var(--accent)}
.tip p{margin:2px 0 0;font-size:13.5px;line-height:1.55;color:var(--ink-2)}

.site-foot{max-width:1160px;margin:0 auto;padding-inline:16px;padding-bottom:40px;display:flex;justify-content:space-between;gap:6px 16px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-3)}
.site-foot p{margin:0}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:600;padding:9px 14px;border-radius:10px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);cursor:pointer;text-decoration:none}
.btn:hover:not(:disabled){border-color:var(--accent)}
.btn svg{width:16px;height:16px}
.btn.ghost{background:transparent}
.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}
.btn.danger{color:var(--danger)}
.btn.small{font-size:13px;padding:6px 11px}
.btn:disabled{opacity:.45;cursor:not-allowed}

/* editor drawer */
.drawer{position:fixed;top:0;right:0;bottom:0;z-index:50;width:min(460px,100%);display:flex;flex-direction:column;background:var(--surface);border-left:1px solid var(--line);box-shadow:-24px 0 48px -24px rgba(0,0,0,.4);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.ed-head{display:flex;justify-content:space-between;align-items:center;padding:18px 20px 12px}
.ed-kicker{margin:0;font-family:var(--mono);font-size:11px;letter-spacing:.14em;color:var(--accent);text-transform:uppercase}
.ed-head h2{margin:0;font-size:18px}
.icon-btn{width:36px;height:36px;border-radius:50%;border:1px solid var(--line-2);background:var(--surface);cursor:pointer;display:grid;place-items:center}
.icon-btn svg{width:16px;height:16px}
.ed-tabs{display:flex;gap:4px;padding:0 20px;border-bottom:1px solid var(--line)}
.ed-tabs button{appearance:none;background:none;border:0;border-bottom:2px solid transparent;padding:10px 12px;font-size:14px;font-weight:600;color:var(--ink-3);cursor:pointer}
.ed-tabs button[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
.ed-body{flex:1;overflow:auto;padding:18px 20px 24px;display:grid;gap:16px;align-content:start}
.field{display:grid;gap:6px;min-width:0}
.field label,.lbl{font-size:12.5px;font-weight:600;color:var(--ink-2)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.hint{margin:0;font-size:12px;color:var(--ink-3)}
.drawer input:not([type="file"]),.drawer textarea,.drawer select{width:100%;font:inherit;font-size:14px;color:var(--ink);background:var(--surface-2);border:1px solid var(--line-2);border-radius:10px;padding:9px 12px}
.drawer textarea{min-height:96px;resize:vertical;line-height:1.6}
.drawer textarea.tall{min-height:340px}
.syntax{font-size:12.5px;color:var(--ink-3)}
.syntax summary{cursor:pointer;color:var(--accent);font-weight:600}
.syntax ul{margin:8px 0 0;padding-left:18px;display:grid;gap:3px}
code{font-family:var(--mono);font-size:.92em;background:var(--accent-soft);color:var(--accent-ink);padding:1px 5px;border-radius:5px}
.ed-files{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.ed-files li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;font-size:13px}
.ed-files li.empty{color:var(--ink-3)}
.ed-files small{color:var(--ink-3)}
.file-btn{justify-self:start}
.ed-ops{display:flex;flex-wrap:wrap;gap:8px;padding-top:14px;border-top:1px solid var(--line)}
.ed-mascot{display:flex;gap:14px;align-items:center}
.ed-mascot .pv{width:64px;flex:0 0 64px}
.ed-mascot .pv svg,.ed-mascot .pv img{display:block;width:100%;height:auto}
.ed-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:14px 20px;border-top:1px solid var(--line)}
.ed-status{font-size:12.5px;color:var(--ink-3)}
.ed-status.on{color:var(--note-ink);font-weight:600}
.ed-actions{display:flex;gap:8px}

.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 24px);transform:translateX(-50%);z-index:60;max-width:calc(100% - 32px);padding:11px 18px;border-radius:12px;background:#0C1830;color:#fff;font-size:14px;box-shadow:0 16px 32px -12px rgba(0,0,0,.5)}

@media (max-width:960px){
  .panel{grid-template-columns:minmax(0,1fr)}
  .p-side{position:static}
}
@media (max-width:860px){
  .road{grid-template-columns:minmax(0,1fr);margin-top:10px}
  .node{flex-direction:row;align-items:flex-start;text-align:left;gap:14px;padding:10px 8px}
  .dotrow{width:72px;height:auto;flex:0 0 72px}
  .dot{width:52px;height:52px}
  .dot svg{width:22px;height:22px}
  .txt{align-items:flex-start;padding-top:4px}
  .tg{max-width:none}
  .arrow,.node.last .arrow{top:calc(10px + 52px + 6px);bottom:4px;left:calc(8px + 36px - 1px);width:2px;height:auto;background:linear-gradient(180deg,var(--accent),var(--cyan))}
  .arrow::after{right:auto;top:auto;left:50%;bottom:0;transform:translate(-50%,0) rotate(135deg)}
  .node.last .arrow{bottom:2px}
  .medal{width:72px;height:72px;padding:3px}
  .spark.s1{right:-8px}
}
@media (max-width:640px){
  .hero-in{flex-direction:column;align-items:stretch}
  .hero-mascot{align-self:flex-end;width:118px;margin-top:-4px}
  .bubble{right:92%;top:10%}
  .facts div{grid-template-columns:minmax(0,1fr);gap:2px}
  .row2{grid-template-columns:minmax(0,1fr)}
  .bubble{white-space:normal;width:max-content;max-width:170px}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

function b64ToBytes(b64){var bin=atob(b64),u=new Uint8Array(bin.length);for(var i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return u;}
function download(idx){
 var f=(state.steps[sel].files||[])[idx];if(!f)return;
 if(!CAP.dl){toast(CAP.dlDone?T('dlNo'):T('dlWait'));return;}
 var bytes=b64ToBytes(f.data),name=f.name,ext=extOf(name);
 var ready;
 if(ALLOWED.indexOf(ext)>=0){ready=Promise.resolve(new Blob([bytes]));}
 else{
  if(!window.JSZip){toast(T('zipFail'));return;}
  var z=new window.JSZip();z.file(name,bytes);
  name=name.replace(/\.[^.]+$/,'')+'.zip';
  ready=z.generateAsync({type:'blob',compression:'DEFLATE'});
 }
 ready.then(function(blob){return CAP.dl.save({filename:name,data:blob});})
 .then(function(){toast(T('dlSaved',name));})
 .catch(function(err){
  var c=err&&err.code;if(c==='declined')return;
  if(c==='rate_limited'){toast(T('dlBusy'));return;}
  toast(T('dlFail',c?' ('+c+')':''));
 });
}

 'Formatting rules: keep every line break. Keep these line-start markers exactly, including leading spaces: "## ", "### ", "- ", "@" (lines like "@Label: value": translate both parts, keep "@" and the first colon), "※", "* ", and circled numbers like ①. Keep **bold** markers. In lines like "value | label" keep the " | " separator.\n'+
 'Keep URLs, numbers, dates, account numbers, phone numbers, room numbers and example Korean names (e.g. 일반홍길동) unchanged.\n'+
 'Glossary (always use): 통합정보시스템 = SUIS System; 인공지능응용학과 = Department of Applied Artificial Intelligence; 수료 = Course Completion; 수료 후 등록 = Post-Completion Registration; 학위자격시험 = Degree Qualifying Exam; 학위청구논문 = Degree Thesis; 재학 중 트랙 = In-Enrollment Track; 수료 트랙 = Completion Track; 지도교수 = advisor; 주임교수 = program chair; 대학원 행정실 = Graduate School Office; 어의관 = Eoui-gwan; 테크뇽 = Technyong; 바로가기 = Go to page; 한국정보과학회 = KIISE.\n\nInput JSON:\n';
function trChunks(jobs){
 var chunks=[],cur={},size=0;
 Object.keys(jobs).forEach(function(k){var n=jobs[k].length;if(size&&size+n>5000){chunks.push(cur);cur={};size=0;}cur[k]=jobs[k];size+=n;});
 if(size)chunks.push(cur);
 return chunks;
}
function translateAll(jobs){
 var c=window.claude;
 var getS=c&&typeof c.use==='function'?Promise.resolve(c.use('sample')).catch(function(){return null;}):Promise.resolve(null);
 return getS.then(function(sample){
  if(!sample)throw {code:'unavailable'};
  var out={};
  return trChunks(jobs).reduce(function(p,chunk){
   return p.then(function(){
    return sample.json(TR_RULES+JSON.stringify(chunk),{modelTier:'default'}).then(function(res){
     if(res&&typeof res==='object')Object.keys(chunk).forEach(function(k){if(typeof res[k]==='string'&&res[k].trim())out[k]=res[k];});
    });
   });
  },Promise.resolve()).then(function(){return out;});
 });
}
function applyTranslations(jobs,res){
 var src=trSources(),old=(state.i18n&&state.i18n.en)||{},en={};
 Object.keys(src).forEach(function(k){
  if(jobs[k]!=null){if(res[k])en[k]={src:jobs[k],text:res[k]};else if(old[k])en[k]=old[k];}
  else if(old[k])en[k]=old[k];
 });
 state.i18n={en:en};
}
function doPublish(btn){
 if(!CAP.art){toast('이 화면에서는 게시할 수 없어요.');return;}
 btn.disabled=true;
 var jobs=trPending(),n=Object.keys(jobs).length,trNote='';
 var prevDate=state.updatedAt,prevI18n=clone(state.i18n||{});
 btn.textContent=n?'영어 번역 중…':'게시 중…';
 (n?translateAll(jobs).then(function(res){
   applyTranslations(jobs,res);
   var missed=Object.keys(trPending()).length;
   if(missed)trNote=' 영어 번역 '+missed+'개는 하지 못해 영어 페이지에 한국어로 보여요.';
  },function(err){
   trNote=' 영어 자동 번역을 하지 못해 바뀐 부분은 영어 페이지에서 한국어로 보여요'+(err&&err.code?' ('+err.code+')':'')+'.';
  }):Promise.resolve())
 .then(function(){
  btn.textContent='게시 중…';
  state.updatedAt=today();
  return CAP.art.publish(buildDocument());
 }).then(function(){
  dirty=false;toast('게시했어요.'+trNote+(trNote?'':' 새 버전을 불러옵니다.'));
 }).catch(function(err){
  state.updatedAt=prevDate;state.i18n=prevI18n;
  var c=err&&err.code,msg;
  if(c==='conflict')msg='다른 곳에서 먼저 수정되어 최신 버전으로 다시 불러옵니다. 변경 내용을 다시 입력해 주세요.';
  else if(c==='not_writer'||c==='not_granted'||c==='consent_required'||c==='capability_disabled')msg='이 화면에서는 게시 권한이 없어요.';
  else if(c==='too_large')msg='첨부 파일이 너무 커서 게시할 수 없어요. 파일 크기를 줄여 주세요.';
  else if(c==='rate_limited')msg='게시가 너무 잦아요. 잠시 후 다시 시도해 주세요.';
  else msg='게시하지 못했어요'+(c?' ('+c+')':'')+'. 잠시 후 다시 시도해 주세요.';
  toast(msg);armed=null;btn.disabled=false;btn.textContent='게시하기';
 });
}

/* ---------- runtime capabilities ---------- */
function initCaps(tries){
 var c=window.claude;
 if(!c||typeof c.use!=='function'){if(tries<24)setTimeout(function(){initCaps(tries+1);},250);else CAP.dlDone=true;return;}
 function safe(name){try{return Promise.resolve(c.use(name)).catch(function(){return null;});}catch(e){return Promise.resolve(null);}}
 safe('downloads').then(function(d){CAP.dl=d;CAP.dlDone=true;});
 Promise.all([safe('user'),safe('artifact')]).then(function(r){
  var u=r[0];CAP.art=r[1];
  return u?Promise.resolve(u.isOwner()).catch(function(){return false;}):false;
 }).then(function(own){
  CAP.owner=!!own&&!!CAP.art;
  var b=document.getElementById('btn-edit');if(b)b.hidden=!CAP.owner;
 });
}

if(REPO_MODE){
 fetch('data/content.json',{cache:'no-cache'}).then(function(r){if(!r.ok)throw new Error(r.status);return r.text();})
 .then(function(t){saved=fromRepo(JSON.parse(t));state=clone(saved);renderMain();})
 .catch(function(){
  app.innerHTML='<p style="max-width:640px;margin:48px auto;padding-inline:16px;color:var(--ink-2)">내용 파일(data/content.json)을 읽지 못했어요. 최근에 고친 부분의 쉼표(,)와 따옴표(")를 확인해 주세요.<br>The content file (data/content.json) could not be read.</p>';
 });
}else{
 renderMain();
 initCaps(0);
}
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(drawWires);
window.addEventListener('load',drawWires);
})();
</script>
